<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f6f7f9;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#0e1217">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #e3e6ea;border-radius:14px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-family:Georgia,serif;font-size:20px">Dineros</p>
                <h1 style="margin:0 0 12px;font-size:20px;font-weight:600">Restablece tu contraseña</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#5d6673">
                  Recibimos una solicitud para cambiar la contraseña de {{ .Email }}. El enlace vence en una hora y solo se puede usar una vez.
                </p>
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#1f6f5c;color:#ffffff;text-decoration:none;font-size:14px;font-weight:500;padding:12px 20px;border-radius:8px">Elegir nueva contraseña</a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#8a93a0">
                  Si no lo pediste tú, ignora este correo: tu contraseña no cambiará.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
