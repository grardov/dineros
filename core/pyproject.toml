[project]
name = "core"
version = "0.1.0"
description = "Dineros backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.156.3",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = [
    "B008",  # Depends() in argument defaults is the FastAPI pattern
    "B904",  # allow raising HTTPException without `from e`
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
