name: Deploy

# main is production. web deploys itself through Vercel's Git integration.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Applies the migrations in db/supabase/migrations that production doesn't have yet.
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
        working-directory: db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  core:
    # Schema first, so the new code never runs against an old schema.
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: core
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
